# Smithery deployment descriptor for @twitterapis/mcp.
#
# READ THIS BEFORE ASSUMING THIS FILE LISTS US. It does not, and on 2026-08-02
# it could not. Smithery retired the model this file was written for: the whole
# "put smithery.yaml in your repo root, connect the repo, we build and host it"
# path is gone, and the string smithery.yaml appears ZERO times across their
# current documentation index at smithery.ai/docs/llms.txt. Listing on Smithery
# today is one of exactly two flows, both of which need a Smithery account and
# an API key that this tenant does not yet have:
#
#   1. URL      publish a public Streamable-HTTP endpoint, scanned by SmitheryBot
#   2. Local    publish a prebuilt MCPB bundle as a stdio release
#
# The file is kept because it costs nothing, it is still read by a handful of
# third-party crawlers that indexed the old convention, and it is an accurate
# description of how to start this server from a config object. It is NOT a
# submission and nothing consumes it on smithery.ai. See README for the state of
# each directory.
#
# Every field still carries a title and a description, because a config schema
# with a bare variable name is how people paste the wrong value into the wrong
# field.
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - twitterapisKey
    properties:
      twitterapisKey:
        type: string
        title: TwitterAPIs API key
        description: >-
          Your twitterapis.com API key. Create one at
          https://www.twitterapis.com/dashboard. Every tool call authenticates
          with it, and usage is billed per call against that key.
      twitterapisBaseUrl:
        type: string
        title: API base URL
        description: >-
          Only set this if you were given a different endpoint. Defaults to
          https://api.twitterapis.com.
        default: https://api.twitterapis.com
      twitterapisTimeoutMs:
        type: number
        title: Request timeout (ms)
        description: >-
          Per-request timeout in milliseconds. Raise it if you page through
          large follower lists on a slow connection.
  commandFunction: |-
    (config) => ({
      command: 'node',
      args: ['src/index.js'],
      env: {
        TWITTERAPIS_KEY: config.twitterapisKey,
        ...(config.twitterapisBaseUrl ? { TWITTERAPIS_BASE_URL: config.twitterapisBaseUrl } : {}),
        ...(config.twitterapisTimeoutMs ? { TWITTERAPIS_TIMEOUT_MS: String(config.twitterapisTimeoutMs) } : {})
      }
    })
